<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101113">
  <meta name="description" content="온전히 시간에 집중하는 벡터 시계. 전체화면과 화면 꺼짐 방지를 지원합니다.">
  <title>Moment — 온전히, 지금</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <path id="digit-0" d="M50 5 C22 5 10 28 10 80 C10 132 22 155 50 155 C78 155 90 132 90 80 C90 28 78 5 50 5Z"/>
      <path id="digit-1" d="M26 30 L55 6 L55 154"/>
      <path id="digit-2" d="M12 40 C14 17 30 5 51 5 C75 5 89 18 89 39 C89 60 75 74 54 93 L11 152 L91 152"/>
      <path id="digit-3" d="M13 27 C25 11 38 5 53 5 C76 5 88 19 88 38 C88 59 73 72 50 76 C76 77 92 92 92 115 C92 139 75 155 51 155 C31 155 18 146 9 133"/>
      <path id="digit-4" d="M75 154 L75 6 L5 111 L97 111"/>
      <path id="digit-5" d="M86 8 L20 8 L15 78 C25 70 37 66 51 66 C76 66 91 83 91 109 C91 138 75 155 51 155 C30 155 16 145 8 131"/>
      <path id="digit-6" d="M83 18 C74 9 64 5 52 5 C24 5 10 33 10 83 L10 108 C10 138 25 155 50 155 C74 155 90 137 90 111 C90 85 75 69 52 69 C32 69 17 81 11 99"/>
      <path id="digit-7" d="M8 8 L92 8 L33 154"/>
      <path id="digit-8" d="M50 76 C28 76 13 62 13 40 C13 19 28 5 50 5 C72 5 87 19 87 40 C87 62 72 76 50 76 C25 76 9 92 9 116 C9 140 26 155 50 155 C74 155 91 140 91 116 C91 92 75 76 50 76Z"/>
      <path id="digit-9" d="M17 142 C26 151 36 155 48 155 C76 155 90 127 90 77 L90 52 C90 22 75 5 50 5 C26 5 10 23 10 49 C10 75 25 91 48 91 C68 91 83 79 89 61"/>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2 9 9 0 1 0 20.8 13.1Z"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
      <symbol id="i-contract" viewBox="0 0 24 24"><path d="M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    </defs>
  </svg>

  <div class="ambient" aria-hidden="true"></div>
  <header class="masthead chrome">
    <a class="wordmark" href="./" aria-label="Moment 시계 홈">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 6v6l4 2"/></svg>
      <span>moment<span class="wordmark-dot">.</span></span>
    </a>
    <button class="wake-status" id="wake-button" type="button" aria-pressed="true" aria-label="화면 꺼짐 방지 상태">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="wake-label">화면 유지 연결 중</span>
    </button>
  </header>

  <main class="stage" id="stage" aria-label="현재 시각">
    <div class="clock-composition">
      <p class="eyebrow" id="zone-label">LOCAL TIME</p>
      <div class="digital-clock" id="digital-clock">
        <svg id="digital-face" viewBox="-5 -5 506 170" role="img" aria-label="현재 시각" xmlns="http://www.w3.org/2000/svg">
          <g class="numerals" fill="none" stroke="currentColor" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
            <use id="hour-tens" href="#digit-0"/>
            <use id="hour-ones" href="#digit-0" x="112"/>
            <use id="minute-tens" href="#digit-0" x="284"/>
            <use id="minute-ones" href="#digit-0" x="396"/>
          </g>
          <g class="colon" fill="currentColor"><circle cx="254" cy="57" r="3.6"/><circle cx="254" cy="103" r="3.6"/></g>
        </svg>
      </div>
      <div class="analog-clock" id="analog-clock" hidden>
        <svg id="analog-face" viewBox="0 0 400 400" role="img" aria-label="현재 시각" xmlns="http://www.w3.org/2000/svg">
          <circle class="dial-outline" cx="200" cy="200" r="191"/>
          <g id="dial-ticks"></g>
          <g class="dial-labels" aria-hidden="true"><text x="200" y="63">12</text><text x="342" y="207">3</text><text x="200" y="351">6</text><text x="58" y="207">9</text></g>
          <g class="hour-hand" id="hour-hand"><path d="M200 217V109"/></g>
          <g class="minute-hand" id="minute-hand"><path d="M200 223V66"/></g>
          <g class="second-hand" id="second-hand"><path d="M200 232V43"/><circle cx="200" cy="200" r="5"/></g>
          <circle class="dial-pin" cx="200" cy="200" r="2"/>
        </svg>
      </div>
      <div class="details">
        <div class="date-block" id="date-block"><p id="date-label"></p><p class="timezone" id="timezone-label"></p></div>
        <div class="seconds" id="seconds" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle class="seconds-track" cx="24" cy="24" r="21"/><circle class="seconds-progress" id="seconds-progress" cx="24" cy="24" r="21" pathLength="60"/><text id="seconds-label" x="24" y="28">00</text></svg>
        </div>
        <span class="period" id="period" hidden></span>
      </div>
    </div>
    <time id="accessible-time" class="sr-only"></time>
  </main>

  <footer class="bottom chrome">
    <div class="toolbar" role="group" aria-label="시계 조작">
      <div class="view-switch" role="group" aria-label="시계 모양">
        <button type="button" id="digital-button" aria-pressed="true">디지털</button>
        <button type="button" id="analog-button" aria-pressed="false">아날로그</button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="icon-button" id="theme-button" type="button" aria-label="밝은 테마로 전환" title="테마 전환 (T)"><svg aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button class="icon-button" id="settings-button" type="button" aria-label="시계 설정" aria-expanded="false" aria-controls="settings-panel" title="시계 설정"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="fullscreen-button" id="fullscreen-button" type="button" title="전체화면 (F)"><svg aria-hidden="true"><use href="#i-expand"/></svg><span>전체화면</span></button>
    </div>
    <p class="keyboard-hint"><kbd>F</kbd> 전체화면<span>·</span>움직이면 조작부가 나타납니다</p>
  </footer>

  <section class="settings-panel" id="settings-panel" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
    <div class="settings-heading"><h1 id="settings-title">나만의 순간</h1><button class="icon-button" id="close-settings" type="button" aria-label="설정 닫기"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <p class="settings-description">편안한 시계로 맞춰보세요.</p>
    <label class="setting-row" for="seconds-toggle"><span>초 표시</span><input class="toggle" id="seconds-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="date-toggle"><span>날짜 표시</span><input class="toggle" id="date-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="format-toggle"><span>24시간 형식</span><input class="toggle" id="format-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="wake-toggle"><span>화면 꺼짐 방지<span class="setting-note" id="wake-detail">이 탭을 보고 있는 동안 화면을 유지합니다.</span></span><input class="toggle" id="wake-toggle" type="checkbox" checked></label>
    <div class="setting-row theme-setting"><span id="theme-label">화면 테마</span><div class="theme-picker" role="group" aria-labelledby="theme-label"><button type="button" data-theme-choice="light" aria-pressed="false">밝게</button><button type="button" data-theme-choice="dark" aria-pressed="true">어둡게</button><button type="button" data-theme-choice="auto" aria-pressed="false">자동</button></div></div>
    <p class="settings-footnote">설정은 이 브라우저에 저장됩니다.</p>
  </section>
  <p class="toast" id="toast" role="status" hidden></p>
  <noscript><p class="noscript">시계를 사용하려면 JavaScript를 켜주세요.</p></noscript>
  <script src="clock.js"></script>
</body>
</html>
