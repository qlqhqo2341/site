  <div class="ambient" aria-hidden="true"></div>
  <header class="masthead chrome">
    <a class="wordmark" href="./" aria-label="Moment 시계 홈">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 6v6l4 2"/></svg>
      <span>moment<span class="wordmark-dot">.</span></span>
    </a>
    <div class="status-area"><button class="wake-status" id="wake-button" type="button" aria-pressed="true" aria-label="화면 꺼짐 방지 상태">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="wake-label">화면 유지 연결 중</span>
    </button><p class="timezone" id="timezone-label"></p></div>
  </header>

  <main class="stage" id="stage" aria-label="현재 시각">
    <div class="clock-composition">
      <div class="date-block" id="date-block"><p id="date-label"></p></div>
      <div class="digital-clock" id="digital-clock">
        <svg id="digital-face" viewBox="0 0 640 174" role="img" aria-label="현재 시각" xmlns="http://www.w3.org/2000/svg">
          <g class="numerals" id="vector-numerals" fill="currentColor">
            <use id="hour-tens" href="#digit-0"/>
            <use id="hour-ones" href="#digit-0"/>
            <use class="colon" id="time-colon" href="#digit-colon"/>
            <use id="minute-tens" href="#digit-0"/>
            <use id="minute-ones" href="#digit-0"/>
          </g>
          <g class="font-numerals" id="font-numerals" fill="currentColor" hidden>
            <text id="font-hour-tens" y="164">0</text>
            <text id="font-hour-ones" y="164">0</text>
            <text id="font-colon" y="140">:</text>
            <text id="font-minute-tens" y="164">0</text>
            <text id="font-minute-ones" y="164">0</text>
          </g>
        </svg>
      </div>
      <div class="analog-clock" id="analog-clock" hidden>
        <svg id="analog-face" viewBox="0 0 400 400" role="img" aria-label="현재 시각" xmlns="http://www.w3.org/2000/svg">
          <circle class="dial-outline" cx="200" cy="200" r="191"/>
          <g id="dial-ticks"></g>
          <g class="dial-labels" aria-hidden="true"><text x="200" y="63">12</text><text x="342" y="207">3</text><text x="200" y="351">6</text><text x="58" y="207">9</text></g>
          <g class="hour-hand" id="hour-hand"><rect x="190" y="99" width="20" height="108" rx="10"/></g>
          <g class="minute-hand" id="minute-hand"><rect x="193" y="60" width="14" height="148" rx="7"/></g>
          <circle class="dial-hub" cx="200" cy="200" r="11"/>
          <g class="second-hand" id="second-hand"><path d="M200 229V43"/><circle cx="200" cy="200" r="4.5"/></g>
          <circle class="dial-pin" cx="200" cy="200" r="2"/>
        </svg>
      </div>
      <div class="details">
        <span class="period" id="period" hidden></span>
        <div class="seconds" id="seconds" aria-hidden="true">
          <svg viewBox="0 0 96 44"><path class="seconds-track" d="M18 37H78"/><path class="seconds-progress" id="seconds-progress" d="M18 37H78" pathLength="60"/><text id="seconds-label" x="41" y="24">00</text><text class="seconds-unit" x="64" y="23">초</text></svg>
        </div>
      </div>
    </div>
    <time id="accessible-time" class="sr-only"></time>
  </main>

  <footer class="bottom chrome">
    <div class="toolbar" role="group" aria-label="시계 조작">
      <div class="view-switch" role="group" aria-label="시계 모양">
        <button type="button" id="digital-button" aria-pressed="true">디지털</button>
        <button type="button" id="analog-button" aria-pressed="false">아날로그</button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="icon-button" id="theme-button" type="button" aria-label="밝은 테마로 전환" title="테마 전환 (T)"><svg aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button class="icon-button" id="settings-button" type="button" aria-label="시계 설정" aria-expanded="false" aria-controls="settings-panel" title="시계 설정"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="fullscreen-button" id="fullscreen-button" type="button" title="전체화면 (F)"><svg aria-hidden="true"><use href="#i-expand"/></svg><span>전체화면</span></button>
    </div>
    <p class="keyboard-hint"><kbd>F</kbd> 전체화면<span>·</span>움직이면 조작부가 나타납니다</p>
  </footer>

  <section class="settings-panel" id="settings-panel" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
    <div class="settings-heading"><h1 id="settings-title">나만의 순간</h1><button class="icon-button" id="close-settings" type="button" aria-label="설정 닫기"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <p class="settings-description">편안한 시계로 맞춰보세요.</p>
    <div class="font-setting">
      <p class="setting-label" id="font-picker-label">숫자 스타일</p>
      <div class="font-picker" id="font-picker" role="group" aria-labelledby="font-picker-label">
        <button class="font-option" id="font-choice-rounded" type="button" data-font-choice="rounded" aria-pressed="true" aria-label="라운드 글꼴" title="Open Runde Semibold"><span class="font-sample" aria-hidden="true">12:34</span><span>라운드</span></button>
        <button class="font-option" id="font-choice-modern" type="button" data-font-choice="modern" aria-pressed="false" aria-label="모던 글꼴" title="Inter Medium"><span class="font-sample" aria-hidden="true">12:34</span><span>모던</span></button>
        <button class="font-option" id="font-choice-slim" type="button" data-font-choice="slim" aria-pressed="false" aria-label="슬림 글꼴" title="Inter Light"><span class="font-sample" aria-hidden="true">12:34</span><span>슬림</span></button>
        <button class="font-option" id="font-choice-mono" type="button" data-font-choice="mono" aria-pressed="false" aria-label="모노 글꼴" title="IBM Plex Mono"><span class="font-sample" aria-hidden="true">12:34</span><span>모노</span></button>
        <button class="font-option" id="font-choice-classic" type="button" data-font-choice="classic" aria-pressed="false" aria-label="클래식 글꼴" title="Lora Medium"><span class="font-sample" aria-hidden="true">12:34</span><span>클래식</span></button>
        <button class="font-option" id="font-choice-digital" type="button" data-font-choice="digital" aria-pressed="false" aria-label="디지털 글꼴" title="Orbitron"><span class="font-sample" aria-hidden="true">12:34</span><span>디지털</span></button>
      </div>
      <p class="font-status" id="font-status" role="status">디지털 숫자와 아날로그 눈금에 적용됩니다.</p>
    </div>
    <label class="setting-row" for="seconds-toggle"><span>초 표시</span><input class="toggle" id="seconds-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="date-toggle"><span>날짜 표시</span><input class="toggle" id="date-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="format-toggle"><span>24시간 형식</span><input class="toggle" id="format-toggle" type="checkbox" checked></label>
    <label class="setting-row" for="wake-toggle"><span>화면 꺼짐 방지<span class="setting-note" id="wake-detail">이 탭을 보고 있는 동안 화면을 유지합니다.</span></span><input class="toggle" id="wake-toggle" type="checkbox" checked></label>
    <div class="setting-row theme-setting"><span id="theme-label">화면 테마</span><div class="theme-picker" role="group" aria-labelledby="theme-label"><button type="button" data-theme-choice="light" aria-pressed="false">밝게</button><button type="button" data-theme-choice="dark" aria-pressed="true">어둡게</button><button type="button" data-theme-choice="auto" aria-pressed="false">자동</button></div></div>
    <p class="settings-footnote">설정은 이 브라우저에 저장됩니다.</p>
  </section>
  <p class="toast" id="toast" role="status" hidden></p>
  <noscript><p class="noscript">시계를 사용하려면 JavaScript를 켜주세요.</p></noscript>
  <script src="clock.js?v=4"></script>
</body>
</html>
